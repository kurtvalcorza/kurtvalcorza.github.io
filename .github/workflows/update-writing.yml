name: Update writing feed

# Refreshes assets/data/writing.json from the Medium + DOST-ASTI RSS feeds and
# commits it when it changes. The site reads that same-origin file, so no live
# cross-origin fetch happens in the browser (the strict CSP stays intact).

on:
  schedule:
    - cron: "30 22 * * *" # daily, ~06:30 PH time
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write
  pages: write

concurrency:
  group: update-writing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch feeds
        run: python scripts/fetch_writing.py

      - name: Commit and publish if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/data/writing.json; then
            echo "No changes to the writing feed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/writing.json
          git commit -m "chore: refresh latest-writing feed"
          git push
          # A push made with GITHUB_TOKEN does not trigger a Pages build on its
          # own, so request one explicitly (site deploys from the main branch).
          echo "Requesting a GitHub Pages build…"
          curl -sf -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
